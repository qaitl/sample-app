[project]
name = "sample-app"
version = "0.1.0"
description = "Todo list demo for Prometheus/Grafana/Loki monitoring"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "prometheus-client>=0.21",
    "prometheus-fastapi-instrumentator>=7.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-logging-loki>=0.3.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "structlog>=25.1",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
