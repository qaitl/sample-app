global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "todo-app"
    static_configs:
      # En production Docker : "sample-app:8000"
      # En développement local (app hors Docker, macOS) : "host.docker.internal:8000"
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
